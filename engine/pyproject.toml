[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-oficial-engine"
version = "1.0.0"
description = "Motor local do Real Oficial — pipeline de cortes por IA (ingestão, transcrição, análise, reframe, legendas, render) exposto como API REST local."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.45",
    "faster-whisper>=1.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "soundfile>=0.12",
    "yt-dlp>=2024.10.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: testes de ponta a ponta (pipeline completo com render real)",
    "live: testes que dependem de rede externa (yt-dlp real)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
